name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        # Le numéro du run sert de versionCode : chaque build est plus récent que le précédent.
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleFullRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/full/release/app-full-release.apk hopescrolling.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hopescrolling-apk
          path: hopescrolling.apk
      # Version Play Store (.aab), signée avec la clé d'envoi si les secrets existent.
      - name: Build Play Store bundle
        env:
          VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew bundlePlayRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hopescrolling-play-bundle
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
      # Une release par build : lien stable .../releases/latest/download/hopescrolling.apk,
      # et Obtainium peut suivre les mises à jour.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Hopescrolling 0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            Installation : télécharge hopescrolling.apk ci-dessous, ou suis ce dépôt avec Obtainium.
          files: hopescrolling.apk
